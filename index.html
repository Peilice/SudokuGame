<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#8e3b3d" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#2e1c1e" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="單機數獨遊戲，四種難度、筆記模式、自動存檔。" />
    <!-- 圖示是四種頁面風格拼成的四宮，不偏向任何一種風格 -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="數獨" />
    <title>數獨</title>
    <script>
      // 在畫面出現前先套用上次選的頁面風格，避免先閃一下預設的花布
      try {
        var s = localStorage.getItem('sudoku.style');
        if (s === 'neon' || s === 'scandi' || s === 'wood') document.documentElement.dataset.style = s;
      } catch (e) {}
    </script>
  </head>
  <body>
    <header class="masthead">
      <div class="masthead-inner">
        <div class="title-group">
          <h1 class="brand">數獨</h1>
          <span class="difficulty-tag" id="difficulty-label"></span>
        </div>
        <div class="status">
          <button class="icon-btn" id="home-btn" type="button" aria-label="回主畫面（進度會保留）" title="回主畫面">
            <svg class="icon icon-stroke" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5" /><path d="M5 9v11h5v-6h4v6h5V9" /></svg>
          </button>
          <span class="timer" id="timer" role="timer" aria-label="經過時間">00:00</span>
          <button class="icon-btn" id="pause-btn" type="button" aria-label="暫停">
            <svg class="icon icon-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" /><rect x="14" y="5" width="4" height="14" rx="1" /></svg>
            <svg class="icon icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" /></svg>
          </button>
          <button class="text-btn" id="new-game-btn" type="button">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14" /><path d="M5 12h14" /></svg>
            <span>新遊戲</span>
          </button>
        </div>
      </div>
    </header>

    <main class="layout">
      <section class="board-wrap" aria-label="盤面">
        <div class="board" id="board" role="grid" aria-label="數獨盤面"></div>
        <div class="seams" id="seams" aria-hidden="true"></div>
        <div class="board-overlay" id="pause-overlay" hidden>
          <p>已暫停</p>
          <button class="btn btn-primary" id="resume-btn" type="button">繼續遊戲</button>
        </div>
        <div class="stamp" id="stamp" aria-hidden="true">
          <span class="stamp-word">完成</span>
        </div>
      </section>

      <section class="controls" id="controls">
        <div class="hint" id="hint" role="note" hidden>
          <p class="hint-text" id="hint-text"></p>
          <button class="hint-close" id="hint-close" type="button">知道了</button>
        </div>

        <div class="play-controls">
          <div class="tools">
            <button class="tool" type="button" data-action="undo">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5" /><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" /></svg>
              <span>復原</span>
            </button>
            <button class="tool" type="button" data-action="redo">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5" /><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13" /></svg>
              <span>重做</span>
            </button>
            <button class="tool" type="button" data-action="erase">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 21-4.3-4.3a1 1 0 0 1 0-1.4l10-10a1 1 0 0 1 1.4 0l5.6 5.6a1 1 0 0 1 0 1.4L11 21" /><path d="M22 21H7" /><path d="m5 11 9 9" /></svg>
              <span>清除</span>
            </button>
            <button class="tool tool-notes" type="button" data-action="notes" aria-pressed="false">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9" /><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" /></svg>
              <span id="notes-label">筆記</span>
            </button>
          </div>

          <div class="numpad" id="numpad" aria-label="數字鍵盤"></div>
        </div>

        <div class="win-panel" id="win-panel" hidden>
          <p class="win-title">這盤解完了</p>
          <p class="win-summary" id="win-summary"></p>
          <button class="btn btn-primary" id="win-new-game" type="button">再來一盤</button>
        </div>

        <dl class="shortcuts" aria-label="鍵盤快捷鍵">
          <div><dt><kbd>1</kbd>–<kbd>9</kbd></dt><dd>填入數字</dd></div>
          <div><dt><kbd>Shift</kbd>+數字</dt><dd>寫筆記</dd></div>
          <div><dt><kbd>N</kbd></dt><dd>切換筆記</dd></div>
          <div><dt>方向鍵</dt><dd>移動</dd></div>
          <div><dt><kbd>Backspace</kbd></dt><dd>清除</dd></div>
          <div><dt><kbd>Ctrl</kbd>+<kbd>Z</kbd> / <kbd>Y</kbd></dt><dd>復原／重做</dd></div>
          <div><dt><kbd>P</kbd></dt><dd>暫停</dd></div>
        </dl>
      </section>
    </main>

    <main class="home" id="home" hidden>
      <section class="home-sheet" aria-labelledby="home-title">
        <h2 id="home-title" tabindex="-1">選擇難度</h2>
        <div class="difficulty-list" id="home-list"></div>
        <p class="generating" hidden><span class="spinner" aria-hidden="true"></span><span class="generating-text">出題中…</span></p>
        <button class="btn btn-ghost" id="home-cancel" type="button" hidden>取消出題</button>
        <p class="legend">每個難度各自保存一盤，回到主畫面不會遺失；只有在同一個難度開新局，才會取代那一盤。</p>
        <div class="style-picker" role="radiogroup" aria-labelledby="style-picker-title">
          <h3 class="style-picker-title" id="style-picker-title">頁面風格</h3>
          <div class="style-options" id="style-options"></div>
        </div>
      </section>
    </main>

    <p class="sr-only" id="announcer" aria-live="polite"></p>

    <div class="rotate-notice" role="alert">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <rect x="15" y="6" width="18" height="32" rx="3" />
        <path d="M22 33h4" />
        <path d="M38 22a14 14 0 0 1-4 10" />
        <path d="m38 32-4 0 0-4" />
      </svg>
      <p class="rotate-title">請把手機轉回直式</p>
      <p class="rotate-sub">遊戲已暫停，轉回來就能繼續</p>
    </div>

    <dialog class="dialog" id="new-game-dialog" aria-labelledby="new-game-title">
      <div class="dialog-step" id="choose-step">
        <h2 id="new-game-title" tabindex="-1" autofocus>選擇難度</h2>
        <div class="difficulty-list" id="difficulty-list"></div>
        <p class="generating" hidden><span class="spinner" aria-hidden="true"></span><span class="generating-text">出題中…</span></p>
        <p class="legend">紅色標記表示同一列、行或宮裡有重複的數字，不代表答錯。每個難度各自保存一盤進度。</p>
        <button class="btn btn-ghost" id="cancel-new-game" type="button">返回目前這盤</button>
      </div>
      <div class="dialog-step" id="confirm-step" hidden>
        <h2 id="confirm-title" tabindex="-1">取代進行中的那盤？</h2>
        <p class="confirm-text" id="confirm-text"></p>
        <div class="dialog-actions">
          <button class="btn btn-ghost" id="confirm-back" type="button">返回</button>
          <button class="btn btn-danger" id="confirm-start" type="button">開始新的一盤</button>
        </div>
      </div>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
